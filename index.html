<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경성의 고독한 미식가들 — 관객 동선 워크플로우 (1막·2막 통합)</title>
<style>
  :root { color-scheme: light;
    --paper:#f7f1e3; --paper2:#efe6d0; --ink:#2b2018; --line:#c9b892;
    --red:#b03a2e; --purple:#7d4a9e; --teal:#177a63; --orange:#c96f14;
    --blue:#2c5f9e; --gold:#a8781a; --green:#4a7c2f; --brown:#7a5230; --grey:#6b5d4d;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--paper); color:var(--ink);
    font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif; padding:12px 16px 10px; }
  header { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  h1 { font-size:16.5px; letter-spacing:.4px; }
  h1 small { font-weight:500; color:var(--grey); font-size:11px; margin-left:8px; }
  .tabs { display:flex; gap:0; border:1.5px solid var(--ink); border-radius:9px; overflow:hidden; }
  .tab { font-size:13px; font-weight:800; padding:6px 18px; cursor:pointer; background:#fffdf6; color:var(--ink);
    border:none; transition:.15s; }
  .tab.on { background:var(--ink); color:var(--paper); }
  #modeBtn, #speedBtn { font-size:12px; font-weight:800; padding:6px 14px; border-radius:9px; border:1.5px solid var(--ink);
    background:#fffdf6; color:var(--ink); cursor:pointer; }
  #modeBtn.block { background:var(--gold); color:#fff; border-color:var(--gold); }
  #speedBtn.fast { background:var(--red); color:#fff; border-color:var(--red); }
  #speedBtn.slow { background:var(--blue); color:#fff; border-color:var(--blue); }
  .dots { display:flex; gap:5px; margin-left:auto; align-items:center; flex-wrap:wrap; }
  .dot { width:9px; height:9px; border-radius:50%; border:1.5px solid var(--grey); cursor:pointer; transition:.2s; }
  .dot.done { background:var(--gold); border-color:var(--gold); }
  .dot.now { background:var(--red); border-color:var(--red); transform:scale(1.35); }
  #board { display:flex; gap:10px; align-items:stretch; }
  #detail { flex:0 0 300px; background:#fffdf6; border:1.5px solid var(--line); border-radius:12px;
    padding:12px 14px; overflow:auto; }
  #detail .dc-no { color:var(--red); font-weight:800; font-size:15px; }
  #detail .dc-title { font-weight:800; font-size:13.5px; margin-bottom:3px; line-height:1.3; }
  #detail .dc-place { font-size:11px; color:var(--grey); margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  #detail .dc-row { font-size:12px; margin:6px 0; line-height:1.45; }
  #detail .dc-row .k { display:block; color:var(--grey); font-weight:700; font-size:10.5px; margin-bottom:1px; }
  #detail .flow { font-size:11.5px; margin:2px 0; line-height:1.4; }
  #detail .flow .in { color:var(--green); font-weight:800; margin-right:3px; }
  #detail .flow .out { color:var(--red); font-weight:800; margin-right:3px; }
  #detail .empty { color:var(--grey); font-size:12px; line-height:1.5; }
  #detail .hint { color:var(--grey); font-size:10px; margin-top:10px; opacity:.8; }
  @media (max-width:820px){ #board{flex-wrap:wrap;} #detail{flex:1 1 100%;} }
  #stage { position:relative; flex:1; min-width:0; aspect-ratio:16/9.4; background:
      radial-gradient(ellipse at 50% 48%, #fbf6ea 0%, var(--paper2) 68%, #e5d8bb 100%);
    border:1.5px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer;
    box-shadow:0 2px 10px rgba(80,60,20,.12) inset; }
  #stage::after { content:'화면 클릭 = 다음 진행 ▸'; position:absolute; right:12px; bottom:8px;
    font-size:11px; color:var(--grey); opacity:.75; pointer-events:none; }
  .node { position:absolute; transform:translate(-50%,-50%); text-align:center; min-width:88px; max-width:174px;
    padding:6px 9px 6px; background:#fffdf6; border:1.5px solid var(--line); border-radius:9px;
    transition:all .4s; opacity:.4; box-shadow:0 1px 4px rgba(80,60,20,.15); pointer-events:none; }
  .node .nm { font-size:11px; font-weight:700; letter-spacing:-.2px; white-space:nowrap; color:var(--grey); }
  .node .sc { font-size:10.5px; font-weight:700; color:var(--ink); margin-top:2px; line-height:1.25; }
  .node .sc:empty { display:none; }
  .node .sc .no { color:var(--red); }
  .node .cast { display:block; font-size:9px; font-weight:600; color:var(--brown); margin-top:1px; line-height:1.2; }
  .node .ct { display:inline-block; margin-top:3px; font-size:12px; font-weight:800; color:#fff;
    background:var(--grey); border-radius:20px; padding:1px 9px; min-width:30px; transition:.3s; }
  .node.on { opacity:1; border-color:var(--gold); box-shadow:0 0 0 2px rgba(168,120,26,.25), 0 2px 8px rgba(80,60,20,.25); }
  .node.on .nm { color:var(--ink); }
  .node.on .ct { background:var(--red); }
  .node.src .ct { background:var(--ink); }
  .node.dst { border-color:var(--red); box-shadow:0 0 0 3px rgba(176,58,46,.28), 0 2px 8px rgba(80,60,20,.3); }
  .node.dim { opacity:.13 !important; }
  .node.hub { min-width:152px; max-width:214px; padding:9px 13px 9px; border-width:2px; border-radius:12px; }
  .node.hub .nm { font-size:12.5px; }
  .node.hub .sc { font-size:11.5px; }
  .node.hub .ct { font-size:14.5px; padding:2px 13px; }
  .chip { position:absolute; z-index:30; font-size:12px; font-weight:800; color:#fff;
    padding:5px 12px; border-radius:20px; white-space:nowrap; pointer-events:none;
    box-shadow:0 3px 8px rgba(0,0,0,.35); transform:translate(-50%,-50%); }
  .route { position:absolute; height:2.5px; transform-origin:left center; border-radius:2px;
    pointer-events:none; z-index:25; opacity:0; }
  #panel { display:flex; gap:14px; align-items:flex-start; margin-top:8px; min-height:78px; }
  #desc { flex:1; }
  #desc .t { font-size:14.5px; font-weight:800; margin-bottom:3px; }
  #desc .t .prog { font-size:11.5px; font-weight:700; color:var(--gold); margin-left:6px; }
  #desc .t .trk { font-size:11px; font-weight:700; color:var(--red); margin-left:6px; }
  #desc .d { font-size:12.5px; line-height:1.5; color:#4a3d2e; }
  #desc .d b.w { color:var(--red); }
  #desc .d .mvline { display:inline-block; font-weight:700; color:var(--ink); }
  #check { flex:0 0 auto; font-size:12px; font-weight:700; background:#fffdf6; border:1.5px dashed var(--gold);
    color:var(--gold); border-radius:8px; padding:8px 12px; margin-top:2px; white-space:nowrap; }
  .btns { display:flex; gap:6px; flex:0 0 auto; margin-top:2px; }
  button.nav { font:inherit; font-size:12px; font-weight:700; padding:7px 13px; border-radius:8px;
    border:1.5px solid var(--ink); background:#fffdf6; color:var(--ink); cursor:pointer; }
  button.nav:hover { background:var(--ink); color:var(--paper); }
  button.nav:disabled { opacity:.35; cursor:default; }
  button.nav:disabled:hover { background:#fffdf6; color:var(--ink); }
  #summary { position:absolute; inset:5% 7%; z-index:40; background:rgba(255,253,246,.97);
    border:2px solid var(--gold); border-radius:12px; padding:16px 20px; overflow:auto; display:none; }
  #summary h2 { font-size:15px; margin-bottom:8px; }
  #summary table { width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:9px; }
  #summary td, #summary th { border-bottom:1px solid var(--line); padding:3px 6px; text-align:left; }
  #summary th { color:var(--grey); font-size:10.5px; }
  #summary .ok { color:var(--green); font-weight:800; }
  #summary .risk { font-size:12px; line-height:1.55; }
  #summary .risk b { color:var(--red); }
  .legend { position:absolute; left:10px; top:8px; z-index:20; display:flex; flex-wrap:wrap; gap:4px 8px;
    max-width:44%; pointer-events:none; }
  .lg { font-size:9.5px; font-weight:700; color:#fff; padding:2px 8px; border-radius:12px; opacity:.9;
    pointer-events:auto; cursor:pointer; user-select:none; }
  .lg.off { opacity:.24; }
  .lg.sel { outline:2px solid var(--ink); outline-offset:1px; }
</style>
</head>
<body>
<header>
  <h1>〈경성의 고독한 미식가들〉 관객 동선<small>0710 · 60명 · 범례 클릭 = 배우 트랙 추적</small></h1>
  <div class="tabs">
    <button class="tab on" id="tabA1">1막</button>
    <button class="tab" id="tabA2">2막</button>
  </div>
  <button id="modeBtn">이동별</button>
  <button id="speedBtn">속도: 보통</button>
  <div class="dots" id="dots"></div>
</header>

<div id="board">
  <div id="stage">
    <div class="legend" id="legend"></div>
    <div id="summary"></div>
  </div>
  <aside id="detail"><div class="dcard" id="dcard"></div></aside>
</div>

<div id="panel">
  <div id="desc"><div class="t"></div><div class="d"></div></div>
  <div id="check"></div>
  <div class="btns">
    <button class="nav" id="prev">◂ 이전</button>
    <button class="nav" id="next">다음 ▸</button>
    <button class="nav" id="reset">처음</button>
  </div>
</div>

<script>
const C = { red:'#b03a2e', purple:'#7d4a9e', teal:'#177a63', orange:'#c96f14',
  blue:'#2c5f9e', gold:'#a8781a', green:'#4a7c2f', brown:'#7a5230', grey:'#6b5d4d' };

function S(no, title, cast){
  return `<span class="no">${no}</span> ${title}<span class="cast">🎭 ${cast}</span>`;
}
function M(from,to,actor,n,color){ return [from,to,actor,n,color]; }

const DETAIL = {
 '1#1':{event:'결혼식 도중 축포와 함께 총성 3발, 다이치가 쓰러진다. 영이·건열·린카가 총을 든 채 발각. 시계 역행 → 1주일 전.'},
 '1#2-1':{event:'카페 손님맞이. 롤렉스 첫 등장, 해운-아이나 첫 대면(손목 잡음→정적). 탐정·다이치·아이나가 관객을 데리고 분기 퇴장.'},
 '1#2-1-1':{event:'해운이 미식 칼럼① 〈완벽한 커피에 대한 찬사〉 낭독 — 아이나 묘사로 미끄러진다.'},
 '1#2-2':{event:'탐정이 관객을 탐정 지망생으로 수업. 린카에게 아이나 뒷조사 자료·돈봉투를 받는다.'},
 '1#2-3':{event:'다이치가 신입 순사(관객)에게 애열단 암호 공책을 보고받고 임무를 분담한다.',line:'질서는 두려움 위에 선다.'},
 '1#2-4':{event:'영재·아이나의 에스페란토 회상("블루아 마로=푸른 바다"). 아이나의 상해본부 동행 요청을 영재가 거절.'},
 '1#3-1':{event:'다이치의 연분홍 러브레터를 해운이 도와 쓴다. 관객이 조선어 교정·배달부가 된다.'},
 '1#3-2':{event:'정종학이 관객에게 부동산 투기 장광설(하시마 섬)을 늘어놓고 서명을 받는다.'},
 '1#3-3':{event:'영이가 관객 머리를 인두로 말며 과거사를 고백. 린카가 등장해 청부를 제안한다.'},
 '1#3-4':{event:'건열의 에스페란토 수업(눈당코후라). 관객 한 명에 해운 미행·롤렉스 탈취 특별 지령.'},
 '1#4':{event:'양조장 게임·막걸리 발효론. "고장난 시계", 아이나의 키스(시계 노림)→영재 난입.'},
 '1#5-1→#5-1-1':{event:'탐정-건열 "상해본부는 3년 전 무너졌다" 경고. 린카가 영이에게 총 전달. 잔류 관객은 해운 칼럼②로 이어짐.'},
 '1#5-2':{event:'정종학이 탐정에게 해운 미행·롤렉스 회수를 의뢰한다.'},
 '1#5-3':{event:'아이나가 영재에게 술지게미를 먹인다. 발작·회복, 기미독립선언문 낭독.'},
 '1#5-4':{event:'건열이 지령들의 필체·커피자국이 같음을 간파. 탄환을 갈아끼워 불발 조작.'},
 '1#6-1':{event:'딴스홀 스윙 교습. 다이치의 약혼 공개→해운 충격. 노부오 환영(아편 중독사).'},
 '1#6-2':{event:'다이치가 린카를 길바닥에 내동댕이. 영이가 목격, 린카 복수 재결심.'},
 '1#6-2-1':{event:'영이가 건열에게 글을 배운다(편지 쓰려고). "매듭은 스스로 끊어내야."'},
 '1#7':{event:'취한 해운을 영재가 데려온다. 술지게미 죽. 영재가 롤렉스를 보고 발작(수인번호 134).'},
 '1#8':{event:'#1 결혼식 재현(같은 대사, 새 정보). 총성 3발→프리즈, 아이나 손에 작은 총. 영이가 범인.'},
 '2#1':{event:'1막 #8 프리즈 직후. 다섯 인물이 각자 독백하며 관객을 다섯 트랙으로 분기. 해운은 잔류.'},
 '2#2-1':{event:'다이치가 신입경찰(관객)에게 건열을 저격범으로 지목. 해운과 대화, 형·영재 질문에 예민.'},
 '2#2-2':{event:'린카가 옷 수선·다도(화경청적) 교습. 정종학 행패→일본인 확인 후 굽신.'},
 '2#2-3':{event:'아이나가 애열단원(관객)에게 첫 지령 폐기를 명령. "다이치는 미끼, 진짜 표적은 천왕."'},
 '2#2-4':{event:'영이 "내가 쐈다" 자백. 아이나가 총을 겨눠 추궁→린카 청부 실토, 온정으로 추방.'},
 '2#2-5':{event:'탐정이 다섯 용의자를 추리하며 애열단 과거를 고백. 해진 환영이 종로 땅문서를 맡긴다.'},
 '2#3-1':{event:'정종학이 양조장을 압류·상납 강요. 해운과 아버지가 충돌. 술지게미 배달 부탁.'},
 '2#3-2':{event:'애열단의 뜻(哀·咽) 설명. 영이가 진실을 깨닫고 합류 자청·주도권 역전.'},
 '2#3-3':{event:'아이나가 다이치 밀고자였음을 폭로, 직접 살인을 의뢰. 린카가 총을 건넨다(=악수).'},
 '2#3-4':{event:'다이치가 건열을 뒤쫓는 추격전.'},
 '2#4-1':{event:'영재 발작이 거사 날짜를 누설. 아이나가 셔츠를 찢어 해운을 겁탈범으로 위장→체포·고문 명령.',line:'전쟁 때문에… 큰 소리를 무서워해요.'},
 '2#4-2':{event:'영이가 건열에게 진범 자백·"총 쏘는 법 가르쳐줘". 결자해지·골목 지리로 동행 강요.'},
 '2#5-1':{event:'아이나-양조장 주인 인수인계. 표적=천왕, 시계가 유일 수단. 퇴각로 불필요(자결 암시).'},
 '2#5-2':{event:'다이치의 채찍 고문("쉬익"). 해운은 음식 비유로 답. 정종학 뇌물 전화로 석방.',line:'쉬익—'},
 '2#5-3':{event:'탐정이 정종학에게 정보를 팔아 500원. 해운이 고문실에 끌려간 사실을 알려준다.'},
 '2#5-4':{event:'골목 피신·진실게임(건열 "눈 감는다"/영이 "사장님 사랑한다"). 동지가 된다.'},
 '2#6-1':{event:'"상해본부는 없었다=아이나(유선) 1인극" 폭로. 건열이 저격수 자처, 영이도 결심.'},
 '2#6-2':{event:'아이나가 다이치를 설득해 시정기념식 동반 참석 관철(아내 자격). 뺨에 죽음의 키스.'},
 '2#6-3':{event:'정종학이 밀고·방치를 실토. 해운이 형 해진의 에스페란토 유서를 발견("해동서림" 단서).'},
 '2#7-1':{event:'해진-영재의 마지막 회상. 유서·시계 폭탄 사용법(왼3 오1 5분), "눈당코후라" 해독.'},
 '2#7-2':{event:'아이나의 가래떡 죄책감·거식 고백, 거사=속죄. 건열이 탄환 박스를 남긴다.'},
 '2#7-3':{event:'정종학이 땅문서·뇌물로 해운 선처를 재청. 다이치가 해진·해운으로 압박.'},
 '2#7-4':{event:'영이가 총을 반납·사례금. 린카가 영이 정장 치수를 잰다("서 있는 모습이 달라졌다").'},
 '2#8-1':{event:'작전회의. 해진 땅문서로 무기 자금, 술항아리 폭탄, 초대장 "뽀리기", 미식파티 집결.'},
 '2#8-2':{event:'웨딩드레스 소매 양쪽에 총 주머니(레이스 보강). "행복은 산 사람의 특권." 창밖 탐정.'},
 '2#9-1':{event:'술지게미 마지막 식구 밥상. 시계 "기념식서 드리죠". 영재가 시계법을 끝내 "몰라"(사랑의 보호).'},
 '2#9-2':{event:'영이의 아버지 편지. 초대장 확보, 사격 연습(뒤에서 안는 자세), "죽지마" 상호 약속.'},

const ACTS = { a1: ACT1, a2: ACT2 };
let actKey = 'a1';
const pos = { a1:{b:0,s:0}, a2:{b:0,s:0} };
let animating = false;
let stepMode = 'move';
let activeColor = null;

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const legendEl = document.getElementById('legend');
let nodeEls = {};
let selectedNode = null;

const LEG = [['다이치',C.red],['린카',C.purple],['아이나',C.teal],['영이',C.orange],
             ['탐정',C.blue],['해운·잔류',C.gold],['건열',C.green],['정종학',C.brown]];
legendEl.innerHTML = LEG.map(([n,c])=>`<span class="lg" data-color="${c}" style="background:${c}">${n}</span>`).join('');
[...legendEl.querySelectorAll('.lg')].forEach(el=>{
  el.onclick = e => { e.stopPropagation(); toggleTrack(el.dataset.color); };
});

function toggleTrack(c){
  activeColor = (activeColor===c) ? null : c;
  [...legendEl.querySelectorAll('.lg')].forEach(el=>{
    el.classList.toggle('sel', activeColor===el.dataset.color);
    el.classList.toggle('off', activeColor && activeColor!==el.dataset.color);
  });
  render();
}

function act(){ return ACTS[actKey]; }
function P(){ return pos[actKey]; }

function buildStage(){
  for (const el of Object.values(nodeEls)) el.remove();
  nodeEls = {};
  for (const [k,n] of Object.entries(act().nodes)) {
    const el = document.createElement('div');
    el.className = 'node' + (n.hub ? ' hub':'');
    el.style.left = n.x+'%'; el.style.top = n.y+'%';
    el.innerHTML = `<div class="nm">${n.label}</div><div class="sc"></div><div class="ct">0</div>`;
    el.style.pointerEvents = 'auto'; el.style.cursor = 'pointer';
    el.onclick = e => { e.stopPropagation(); selectedNode = k; renderDetail(); };
    stage.appendChild(el); nodeEls[k] = el;
  }
  dotsEl.innerHTML = '';
  act().steps.forEach((_,i)=>{
    const d = document.createElement('div'); d.className='dot';
    d.onclick = e => { e.stopPropagation(); if(!animating){ P().b=i; P().s=act().steps[i].mv.length; render(); } };
    dotsEl.appendChild(d);
  });
}

function center(k){
  const r = nodeEls[k].getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { x: r.left + r.width/2 - s.left, y: r.top + r.height/2 - s.top };
}

function countsAt(b, s){
  const step = act().steps[b];
  if (b===0 || step.mv.length===0) return {...step.counts};
  const base = {...act().steps[b-1].counts};
  for (let i=0;i<s;i++){
    const [from,to,,n] = step.mv[i];
    base[from] = (base[from]||0) - n;
    base[to]   = (base[to]||0) + n;
    if (base[from] <= 0) delete base[from];
  }
  return base;
}

function shownScenes(b, s){
  const step = act().steps[b];
  const set = new Set();
  if (b===0 || step.mv.length===0){ Object.keys(step.scenes||{}).forEach(k=>set.add(k)); return set; }
  const toNodes = new Set(); step.mv.forEach(m=>toNodes.add(m[1]));
  Object.keys(step.scenes||{}).forEach(k=>{ if(!toNodes.has(k)) set.add(k); });
  for (let i=0;i<s;i++) set.add(step.mv[i][1]);
  return set;
}

function parseScene(html){
  const no = (html.match(/class="no">([^<]*)</) || ['',''])[1];
  const cast = (html.match(/🎭\s*([^<]*)</) || ['',''])[1];
  let title = html.replace(/<span class="no">[^<]*<\/span>\s*/, '')
                  .replace(/<span class="cast">[\s\S]*$/, '').trim();
  return { no, title, cast };
}

function sceneFlow(b, k){
  const inn=[], out=[];
  const step = act().steps[b];
  (step.mv||[]).forEach(m=>{ if(m[1]===k) inn.push({actor:m[2], n:m[3], from:act().nodes[m[0]].label}); });
  const nx = act().steps[b+1];
  if (nx) (nx.mv||[]).forEach(m=>{ if(m[0]===k) out.push({actor:m[2], n:m[3], to:act().nodes[m[1]].label}); });
  return { inn, out };
}

function renderDetail(){
  const card = document.getElementById('dcard');
  const step = act().steps[P().b];
  const keys = Object.keys(step.scenes || {});
  let k = (selectedNode && keys.includes(selectedNode)) ? selectedNode : keys[0];
  if (!k){ card.innerHTML = '<div class="empty">이 단계에는 장면 정보가 없습니다.<br>공간을 클릭하면 상세가 표시됩니다.</div>'; return; }
  const ps = parseScene(step.scenes[k]);
  const det = DETAIL[(actKey==='a1'?'1':'2') + ps.no] || {};
  const { inn, out } = sceneFlow(P().b, k);
  const cnt = (countsAt(P().b, step.mv.length)[k]) || 0;
  const placeLabel = (step.labels && step.labels[k]) || act().nodes[k].label;

  let h = `<div class="dc-no">${ps.no}</div><div class="dc-title">${ps.title}</div>`;
  h += `<div class="dc-place">${placeLabel} · 관객 ${cnt}명</div>`;
  if (ps.cast) h += `<div class="dc-row"><span class="k">🎭 등장</span>${ps.cast}</div>`;
  if (det.event) h += `<div class="dc-row"><span class="k">📌 주요 사건</span>${det.event}</div>`;
  if (det.line) h += `<div class="dc-row"><span class="k">💬 주요 대사</span>"${det.line}"</div>`;
  let f = '';
  if (inn.length) f += inn.map(x=>`<div class="flow"><span class="in">IN</span>${x.actor} ${x.n}명 ← ${x.from}</div>`).join('');
  else f += `<div class="flow"><span class="in">IN</span>이전 공간에서 잔류 ${cnt}명</div>`;
  if (out.length) f += out.map(x=>`<div class="flow"><span class="out">OUT</span>${x.actor} ${x.n}명 → ${x.to}</div>`).join('');
  else f += `<div class="flow"><span class="out">OUT</span>다음 합류점까지 잔류</div>`;
  h += `<div class="dc-row"><span class="k">🚶 관객 이동</span></div>${f}`;
  h += `<div class="hint">다른 공간을 클릭하면 그 장면 상세가 표시됩니다.</div>`;
  card.innerHTML = h;
}

function render(){
  const step = act().steps[P().b];
  const b = P().b, s = P().s;
  const moves = step.mv;
  const previewing = moves.length>0 && s===0;
  const finished  = moves.length===0 || s>=moves.length;
  const cnt = countsAt(b, s);
  const shown = shownScenes(b, s);
  const curMove = (!previewing && !finished) ? moves[s-1] : null;

  const trkNodes = new Set();
  if (activeColor) step.mv.forEach(m=>{ if(m[4]===activeColor){ trkNodes.add(m[0]); trkNodes.add(m[1]); } });

  for (const k of Object.keys(act().nodes)){
    const c = cnt[k] ?? 0;
    const el = nodeEls[k];
    el.querySelector('.nm').textContent = (step.labels && step.labels[k]) || act().nodes[k].label;
    el.querySelector('.ct').textContent = c;
    el.querySelector('.sc').innerHTML = (shown.has(k) && step.scenes[k]) ? step.scenes[k] : '';
    el.classList.toggle('on', c>0 || shown.has(k));
    el.classList.remove('src','dst');
    el.classList.toggle('dim', !!activeColor && !trkNodes.has(k));
  }
  if (curMove){
    nodeEls[curMove[0]].classList.add('src');
    nodeEls[curMove[1]].classList.add('dst');
  }

  const head = (actKey==='a1'?'1막 ':'2막 ')+(b+1)+'/'+act().steps.length+' · '+step.t;
  const prog = moves.length>0 ? `<span class="prog">이동 ${Math.min(s,moves.length)}/${moves.length}</span>` : '';
  const trk  = activeColor ? `<span class="trk">◆ 트랙 추적</span>` : '';
  document.querySelector('#desc .t').innerHTML = head + prog + trk;

  let body;
  if (previewing){
    const list = moves.map(m=>{
      const dim = activeColor && m[4]!==activeColor;
      return `<span style="${dim?'opacity:.32':'font-weight:800'}">${m[2]} ${m[3]}명 → ${act().nodes[m[1]].label}</span>`;
    }).join(' &nbsp;·&nbsp; ');
    body = `<b>이동 예고 (${moves.length}건):</b> <span class="mvline">${list}</span><br>화면 클릭 시 ${stepMode==='block'?'블록을 한 번에':'인솔 이동을 하나씩'} 진행합니다.`;
  } else if (curMove){
    body = `<span class="mvline">▶ ${curMove[2]}가 관객 ${curMove[3]}명을 인솔 → ${act().nodes[curMove[1]].label}</span>`;
  } else {
    body = step.d;
  }
  document.querySelector('#desc .d').innerHTML = body.replaceAll('⚠','<b class="w">⚠</b>');
  document.getElementById('check').textContent = finished ? step.chk : (previewing ? '예고' : `진행 중 (${s}/${moves.length})`);

  [...dotsEl.children].forEach((d,j)=>{ d.className='dot'+(j<b?' done':j===b?' now':''); });
  document.getElementById('prev').disabled = (b===0 && s===0);
  document.getElementById('next').disabled = (b===act().steps.length-1 && finished);

  const sm = document.getElementById('summary');
  const showSum = step.summary && finished;
  sm.style.display = showSum ? 'block' : 'none';
  if (showSum){
    const rows = act().steps.filter(x=>!x.summary).map(x=>
      `<tr><td>${x.t.split('—')[0].trim()}</td><td>${x.chk}</td><td class="ok">✓</td></tr>`).join('');
    sm.innerHTML = `<h2>${act().sumTitle}</h2>
      <table><tr><th>단계</th><th>검산</th><th></th></tr>${rows}</table>
      <div class="risk"><b>남은 리스크 · 추정치</b><br>${act().risks}</div>`;
  }

  renderDetail();
}

const BASE = { APPEAR:350, HOLD:750, MOVE:1250, FADE:350 };
let speedMul = 1;
function T(){ const a=BASE.APPEAR*speedMul, h=BASE.HOLD*speedMul, m=BASE.MOVE*speedMul, f=BASE.FADE*speedMul;
  return { a, h, m, f, tot:a+h+m+f }; }

function fly(m, delay=0){
  const [from,to,actor,n,color] = m;
  const dim = activeColor && color!==activeColor;
  const peak = dim ? 0.22 : 1;
  const a = center(from), b = center(to);
  const dx = b.x-a.x, dy = b.y-a.y;
  const len = Math.hypot(dx,dy), ang = Math.atan2(dy,dx)*180/Math.PI;
  const { a:TA, h:TH, m:TM, tot:TOT } = T();

  const line = document.createElement('div');
  line.className='route'; line.style.background=color;
  line.style.left=a.x+'px'; line.style.top=a.y+'px';
  line.style.transform=`rotate(${ang}deg)`;
  stage.appendChild(line);
  line.animate([
    { width:'0px', opacity:0 },
    { width:'0px', opacity:0, offset:(TA+TH)/TOT },
    { width:len+'px', opacity:dim?0.15:0.55, offset:(TA+TH+TM)/TOT },
    { width:len+'px', opacity:0 }
  ], { duration:TOT, delay, easing:'ease', fill:'forwards' });
  setTimeout(()=>line.remove(), delay+TOT+80);

  const o1 = TA/TOT;
  const o2 = (TA+TH)/TOT;
  const o3 = (TA+TH+TM)/TOT;
  const chip = document.createElement('div');
  chip.className='chip'; chip.textContent=`${actor} ${n}명`; chip.style.background=color;
  chip.style.left=a.x+'px'; chip.style.top=a.y+'px'; chip.style.opacity='0';
  stage.appendChild(chip);
  chip.animate([
    { transform:'translate(-50%,-50%) scale(.8)', opacity:0, offset:0 },
    { transform:'translate(-50%,-50%) scale(1.12)', opacity:peak, offset:o1 },
    { transform:'translate(-50%,-50%) scale(1.12)', opacity:peak, offset:o2 },
    { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1)`, opacity:peak, offset:o3 },
    { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.9)`, opacity:0, offset:1 }
  ], { duration:TOT, delay, easing:'cubic-bezier(.4,0,.3,1)', fill:'forwards' });
  setTimeout(()=>chip.remove(), delay+TOT+80);
}

function quickHead(step){
  const head=(actKey==='a1'?'1막 ':'2막 ')+(P().b+1)+'/'+act().steps.length+' · '+step.t;
  document.querySelector('#desc .t').innerHTML = head+`<span class="prog">이동 ${P().s}/${step.mv.length}</span>`+(activeColor?`<span class="trk">◆ 트랙 추적</span>`:'');
}

function runBlockAnim(step, fromIdx){
  animating = true;
  let d = 0;
  const gap = 500 * speedMul;
  for (let i=fromIdx; i<step.mv.length; i++){ fly(step.mv[i], d); d += gap; }
  P().s = step.mv.length;
  setTimeout(()=>{ render(); animating=false; }, d + T().m);
  quickHead(step);
  document.querySelector('#desc .d').innerHTML = `<span class="mvline">▶ 블록 이동 진행…</span>`;
}

function advance(){
  const step = act().steps[P().b];
  const moves = step.mv;
  if (stepMode === 'block'){
    if (moves.length>0 && P().s < moves.length){ runBlockAnim(step, P().s); return; }
    if (P().b < act().steps.length-1){
      P().b++; const nx = act().steps[P().b];
      if (nx.mv.length) runBlockAnim(nx, 0);
      else { P().s = 0; render(); }
    }
    return;
  }
  if (moves.length>0 && P().s < moves.length){
    const m = moves[P().s]; P().s++;
    animating = true; fly(m, 0);
    setTimeout(()=>{ render(); animating=false; }, T().tot);
    quickHead(step);
    document.querySelector('#desc .d').innerHTML = `<span class="mvline">▶ ${m[2]}가 관객 ${m[3]}명을 인솔 → ${act().nodes[m[1]].label}</span>`;
    return;
  }
  if (P().b < act().steps.length-1){ P().b++; P().s = 0; render(); }
}

function back(){
  if (P().s > 0){ P().s = 0; render(); return; }
  if (P().b > 0){ P().b--; P().s = act().steps[P().b].mv.length; render(); }
}

function switchAct(k){
  if (animating || actKey===k) return;
  actKey = k;
  selectedNode = null;
  document.getElementById('tabA1').classList.toggle('on', k==='a1');
  document.getElementById('tabA2').classList.toggle('on', k==='a2');
  buildStage();
  render();
}

function toggleMode(){
  if (animating) return;
  stepMode = (stepMode==='move') ? 'block' : 'move';
  const btn = document.getElementById('modeBtn');
  btn.textContent = (stepMode==='block') ? '블록' : '이동별';
  btn.classList.toggle('block', stepMode==='block');
  render();
}

const SPEEDS = [ ['보통',1], ['느림',1.7], ['빠름',0.5] ];
let speedIdx = 0;
function cycleSpeed(){
  if (animating) return;
  speedIdx = (speedIdx+1) % SPEEDS.length;
  const [label, mul] = SPEEDS[speedIdx];
  speedMul = mul;
  const btn = document.getElementById('speedBtn');
  btn.textContent = '속도: ' + label;
  btn.classList.toggle('slow', mul>1);
  btn.classList.toggle('fast', mul<1);
}

stage.addEventListener('click', ()=>{ if(!animating) advance(); });
document.getElementById('next').onclick = e=>{ e.stopPropagation(); if(!animating) advance(); };
document.getElementById('prev').onclick = e=>{ e.stopPropagation(); if(!animating) back(); };
document.getElementById('reset').onclick = e=>{ e.stopPropagation(); if(!animating){ P().b=0; P().s=0; render(); } };
document.getElementById('tabA1').onclick = ()=>switchAct('a1');
document.getElementById('tabA2').onclick = ()=>switchAct('a2');
document.getElementById('modeBtn').onclick = e=>{ e.stopPropagation(); toggleMode(); };
document.getElementById('speedBtn').onclick = e=>{ e.stopPropagation(); cycleSpeed(); };
document.addEventListener('keydown', e=>{
  if(animating) return;
  if((e.key==='ArrowRight'||e.key===' ')){ e.preventDefault(); advance(); }
  if(e.key==='ArrowLeft'){ back(); }
  if(e.key==='1') switchAct('a1');
  if(e.key==='2') switchAct('a2');
  if(e.key.toLowerCase()==='m') toggleMode();
  if(e.key.toLowerCase()==='s') cycleSpeed();
});

buildStage();
render();
</script>
</body>
</html>
